# General GitLab pipeline configuration for LLNL systems. This file consumes
# GitLab CI Components from llnl/radiuss-shared-ci (GitLab 17.0 or newer).

variables:
  # Kripke builds require their bundled dependencies and the shared job lists.
  GIT_SUBMODULE_STRATEGY: recursive

  # Required information for GitHub status reporting.
  GITHUB_PROJECT_NAME: "Kripke"
  GITHUB_PROJECT_ORG: "LLNL"

  # Keep expansion deferred so machine jobs can override command variables.
  JOB_CMD:
    value: "./scripts/gitlab/build_and_test.sh"
    expand: false

# Components intentionally do not declare stages, allowing project-level
# customization. Both stages below are required by the selected components.
stages:
  - prerequisites
  - build-and-test

include:
  # Provides machine checks and templates for child-pipeline triggers.
  - component: $CI_SERVER_FQDN/radiuss/radiuss-shared-ci/base-pipeline@2026.6.0
    inputs:
      github_project_name: $GITHUB_PROJECT_NAME
      github_project_org: $GITHUB_PROJECT_ORG
      github_token: $RSCI_GITHUB_STATUS_TOKEN

  # Project allocations and variants used by the child-pipeline components.
  - local: '.gitlab/custom-variables.yml'

# The common RADIUSS job definitions are assembled with the project-specific
# additions below. This mirrors the job-list pattern used by Umpire.
generate-job-lists:
  stage: prerequisites
  tags: [shell, oslic]
  variables:
    RADIUSS_JOBS_PATH: "scripts/radiuss-spack-configs/gitlab/radiuss-jobs"
    LOCAL_JOBS_PATH: ".gitlab/jobs"
  script:
    - cat ${RADIUSS_JOBS_PATH}/dane.yml ${LOCAL_JOBS_PATH}/dane.yml > dane-jobs.yml
    - cat ${RADIUSS_JOBS_PATH}/matrix.yml ${LOCAL_JOBS_PATH}/matrix.yml > matrix-jobs.yml
  artifacts:
    paths:
      - dane-jobs.yml
      - matrix-jobs.yml

# DANE
dane-up-check:
  extends: [.dane, .machine-check]
  variables:
    ASSOCIATED_CHILD_PIPELINE: "dane-build-and-test"

dane-build-and-test:
  extends: [.dane, .build-and-test]
  needs: [dane-up-check, generate-job-lists]
  trigger:
    include:
      - component: $CI_SERVER_FQDN/radiuss/radiuss-shared-ci/dane-pipeline@2026.6.0
        inputs:
          job_cmd: $JOB_CMD
          shared_alloc: $DANE_SHARED_ALLOC
          job_alloc: $DANE_JOB_ALLOC
          github_project_name: $GITHUB_PROJECT_NAME
          github_project_org: $GITHUB_PROJECT_ORG
          alloc_name: $ALLOC_NAME
      - local: '.gitlab/custom-jobs.yml'
      - artifact: 'dane-jobs.yml'
        job: 'generate-job-lists'

# MATRIX
matrix-up-check:
  extends: [.matrix, .machine-check]
  variables:
    ASSOCIATED_CHILD_PIPELINE: "matrix-build-and-test"

matrix-build-and-test:
  extends: [.matrix, .build-and-test]
  needs: [matrix-up-check, generate-job-lists]
  trigger:
    include:
      - component: $CI_SERVER_FQDN/radiuss/radiuss-shared-ci/matrix-pipeline@2026.6.0
        inputs:
          job_cmd: $JOB_CMD
          shared_alloc: $MATRIX_SHARED_ALLOC
          job_alloc: $MATRIX_JOB_ALLOC
          github_project_name: $GITHUB_PROJECT_NAME
          github_project_org: $GITHUB_PROJECT_ORG
          alloc_name: $ALLOC_NAME
      - local: '.gitlab/custom-jobs.yml'
      - artifact: 'matrix-jobs.yml'
        job: 'generate-job-lists'
