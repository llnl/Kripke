# Variables in this file are included by the parent pipeline and passed to the
# machine components. Keep job templates in custom-jobs.yml instead.
variables:
  ALLOC_NAME: ${CI_PROJECT_NAME}_ci_${CI_PIPELINE_ID}

  # Dane (SLURM) CPU allocation settings.
  DANE_SHARED_ALLOC: "--exclusive --reservation=ci --time=30 --nodes=1"
  DANE_JOB_ALLOC: "--reservation=ci --overlap --nodes=1"
  PROJECT_DANE_VARIANTS: "+mpi +openmp +tests"
  PROJECT_DANE_DEPS: ""

  # Matrix jobs use individual allocations. This supports GPU jobs and avoids
  # holding an allocation while the relatively long Kripke builds are queued.
  MATRIX_SHARED_ALLOC: "OFF"
  MATRIX_JOB_ALLOC: "--partition=pci --time=30 --gpus=1"
  PROJECT_MATRIX_VARIANTS: "+mpi +openmp +tests +cuda cuda_arch=90"
  PROJECT_MATRIX_DEPS: ""
